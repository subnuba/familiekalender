[build]
  publish = "site"
  # Legger appens kode inn i varsel-funksjonen (samme utregning som appen)
  command = "node netlify/bygg.mjs"

# Appen skal alltid hente siste versjon av selve siden
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
